<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Admin - Enrollments</title>
<style>
  body { font-family: sans-serif; background:#0b1f1a; color:#eee; padding:20px; }
  input, button { padding:10px; font-size:16px; margin:5px 0; }
  table { width:100%; border-collapse: collapse; margin-top:20px; }
  th, td { border:1px solid #444; padding:8px; text-align:left; font-size:14px; }
  th { background:#123; }
</style>
</head>
<body>
  <h2>Al-Faiz Academy — Admissions</h2>
  <input type="password" id="pw" placeholder="Admin password" />
  <button onclick="load()">View</button>
  <div id="result"></div>
<script>
async function load() {
  const pw = document.getElementById('pw').value;
  const res = await fetch('/api/admissions?password=' + encodeURIComponent(pw));
  if (!res.ok) { document.getElementById('result').innerHTML = '<p style="color:red">Wrong password</p>'; return; }
  const data = await res.json();
  let html = '<table><tr><th>Name</th><th>Age</th><th>Gender</th><th>Course</th><th>Phone</th><th>Notes</th><th>Date</th></tr>';
  for (const r of data.results) {
    html += `<tr><td>${r.full_name}</td><td>${r.student_age}</td><td>${r.gender}</td><td>${r.course_interest}</td><td>${r.phone}</td><td>${r.notes||''}</td><td>${r.created_at}</td></tr>`;
  }
  html += '</table>';
  document.getElementById('result').innerHTML = html;
}
</script>
</body>
  </html>
